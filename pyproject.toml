[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-agent"
version = "0.1.0"
description = "Industrial document audit agent (作业指导书 + 高后果区一区一案)"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "lxml>=5.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
industry-agent = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real document fixtures or live LLM",
    "slow: takes >5s",
]
